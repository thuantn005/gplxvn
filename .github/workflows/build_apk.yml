name: Build APK (San Chia Giai 535)

# Toan bo qua trinh build chay TREN GITHUB ACTIONS, khong can may local co
# Flutter/Android SDK gi ca (dung nhu cach lam voi repo lotto-scan). Chi
# can push code (lib/, pubspec.yaml) qua zip upload nhu thuong le, workflow
# nay se tu:
#   1. Neu chua co android/ (du an moi tinh) -> chay `flutter create .` de
#      Flutter SDK tu sinh toan bo khung Android/iOS chuan (khong tu tay
#      viet cac file Gradle de tranh sai sot).
#   2. Ghi de lib/ va pubspec.yaml bang ban trong repo (buoc 1 co the tao
#      pubspec.yaml/lib mac dinh, can ghi de lai bang ban that).
#   3. Neu co secret GOOGLE_SERVICES_JSON -> ghi vao android/app/ va tu
#      dong bat plugin Google Services (Firebase/FCM) trong Gradle.
#   4. flutter pub get -> flutter build apk --release.
#   5. Upload APK lam artifact + tao GitHub Release.
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiem tra da co code app (pubspec.yaml) o goc repo chua
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::error::Khong thay pubspec.yaml o goc repo - code app (zip) chua duoc"
            echo "::error::giai nen vao repo. Vao GitHub -> Add file -> Upload files -> tha"
            echo "::error::file zip code app vao -> Commit vao main. Doi workflow 'Tu dong"
            echo "::error::giai nen...' chay xong roi hang build_apk.yml se tu chay tiep."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Sinh khung Android/iOS neu chua co (lan build dau tien)
        run: |
          set -e
          if [ ! -d android ]; then
            echo "Chua co thu muc android/ - chay flutter create de Flutter SDK tu sinh khung chuan..."
            mkdir -p /tmp/scaffold
            flutter create --org com.thuantn005 --project-name gplxvn /tmp/scaffold
            cp -r /tmp/scaffold/android .
            cp -r /tmp/scaffold/ios . || true
            echo "Da sinh xong khung android/ (va ios/ neu co)."
          else
            echo "Da co android/ san - bo qua buoc sinh khung."
          fi

      - name: Cau hinh Google Services (FCM) neu co secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "CANH BAO: chua co secret GOOGLE_SERVICES_JSON - build van chay nhung FCM se KHONG hoat dong."
            echo "Xem README.md muc 'Cau hinh Firebase (FCM)' de biet cach tao va them secret nay."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "Da ghi android/app/google-services.json"

          # Bat plugin Google Services trong Gradle (Kotlin DSL, template
          # Flutter moi) - chi them neu chua co, tranh them trung lap khi
          # chay lai nhieu lan.
          PROJECT_GRADLE="android/settings.gradle.kts"
          APP_GRADLE="android/app/build.gradle.kts"
          if [ -f "$PROJECT_GRADLE" ] && ! grep -q "com.google.gms.google-services" "$PROJECT_GRADLE"; then
            sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$PROJECT_GRADLE"
          fi
          if [ -f "$APP_GRADLE" ] && ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' "$APP_GRADLE"
          fi
          echo "Da bat plugin Google Services trong Gradle (kiem tra lai android/app/build.gradle.kts neu build loi o buoc sau)."

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gplxvn-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Tao GitHub Release kem APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "San Chia Giai 535 - build ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
