name: Build Release AAB

# Tự động chạy mỗi khi push code lên nhánh main - không cần tạo tag thủ công.
# Vẫn giữ trigger theo tag + chạy tay để linh hoạt khi cần build riêng 1 bản.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Nếu repo chỉ chứa file zip (thay vì đã giải nén sẵn), tự động giải nén
      # ra đúng cấu trúc trước khi build. Cho phép bạn chỉ cần upload 1 file zip
      # lên GitHub thay vì kéo-thả từng thư mục (tránh sót thư mục ẩn .github).
      - name: Extract project source (nếu repo ở dạng zip)
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Tìm thấy $ZIP_FILE - đang giải nén..."
            unzip -oq "$ZIP_FILE" -d _extracted
            # Zip có 1 thư mục gốc (VD: gplx_vn/) chứa toàn bộ project bên trong,
            # copy nội dung bên trong thư mục đó ra root để flutter build nhận đúng.
            INNER_DIR=$(find _extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
            cp -rf "$INNER_DIR"/. .
            rm -rf _extracted
            echo "Đã giải nén xong."
          else
            echo "Không có file zip, dùng trực tiếp code đã có trong repo."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Project thiếu 1 số file khung Android bắt buộc (gradlew, MainActivity.kt,
      # build.gradle gốc, settings.gradle, res icons/theme...). Dùng chính
      # "flutter create" (đã có Flutter ở bước trên) để tự sinh bản chuẩn vào thư
      # mục tạm, rồi chỉ ghép các file CÒN THIẾU vào project - không đụng tới
      # AndroidManifest.xml hay app/build.gradle đã tùy biến sẵn (AdMob, ký app...).
      - name: Bổ sung khung Android còn thiếu (nếu cần)
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Thiếu khung Android gốc - đang tự sinh bổ sung..."
            flutter create --platforms=android --org com.gplxvn --project-name app /tmp/scaffold_app > /dev/null

            # Gradle wrapper - bắt buộc để build được, không có phần tùy biến gì nên copy thẳng
            mkdir -p android/gradle/wrapper
            cp /tmp/scaffold_app/android/gradlew android/gradlew
            cp /tmp/scaffold_app/android/gradlew.bat android/gradlew.bat
            cp /tmp/scaffold_app/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            cp /tmp/scaffold_app/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
            chmod +x android/gradlew

            # File cấu hình gốc của project Android (không tùy biến gì, dùng bản chuẩn)
            cp -n /tmp/scaffold_app/android/build.gradle android/build.gradle 2>/dev/null || true
            cp -n /tmp/scaffold_app/android/settings.gradle android/settings.gradle 2>/dev/null || true
            cp -n /tmp/scaffold_app/android/gradle.properties android/gradle.properties 2>/dev/null || true

            # MainActivity.kt - bắt buộc phải có cho Android v2 embedding, đây là
            # lỗi chính xác gây ra "deleted Android v1 embedding" ở lần build trước
            mkdir -p android/app/src/main/kotlin/com/gplxvn/app
            printf 'package com.gplxvn.app\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n' > android/app/src/main/kotlin/com/gplxvn/app/MainActivity.kt

            # Theme (LaunchTheme/NormalTheme) + icon mặc định - AndroidManifest.xml
            # của ta đang tham chiếu tới các resource này
            mkdir -p android/app/src/main/res
            cp -rn /tmp/scaffold_app/android/app/src/main/res/. android/app/src/main/res/

            echo "Đã bổ sung xong khung Android."
          else
            echo "Đã có đủ khung Android, bỏ qua bước này."
          fi

      - name: Install dependencies
        run: flutter pub get

      # Giải mã keystore từ GitHub Secret (base64) ra file .jks thật
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      # Tạo file key.properties từ secrets, build.gradle sẽ đọc file này
      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Build AAB (App Bundle - dùng để upload Play Console)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Build APK (dùng để tự cài test trên điện thoại)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
